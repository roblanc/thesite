<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Apply the saved / system colour scheme before first paint (same logic as
    // src/contexts/ThemeContext.tsx) so dark-mode visitors don't get a white flash.
    (function () {
      try {
        var theme = localStorage.getItem("thesite-theme") || "system";
        if (theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <script>
    // Homepage fast path. Without this the feed is a 4-step waterfall:
    // HTML -> entry JS -> lazy Index route chunk -> /api/news -> first image.
    // On "/" only, start the route chunk and the feed request right away, in
    // parallel with the entry bundle. (Kept before any stylesheet so it runs
    // immediately instead of waiting for CSS.)
    (function () {
      if (location.pathname !== "/") return;
      var head = document.head;
      var hero = document.createElement("link");
      hero.rel = "preload";
      hero.as = "image";
      hero.href = "/hero-illustration-headphones.webp";
      hero.imageSrcset = "/hero-illustration-headphones-320.webp 320w, /hero-illustration-headphones.webp 480w";
      hero.imageSizes = "(min-width: 1024px) 192px, 160px";
      hero.fetchPriority = "high";
      head.appendChild(hero);
      function preload(rel, href, as) {
        var link = document.createElement("link");
        link.rel = rel;
        link.href = href;
        if (as) link.as = as;
        link.crossOrigin = "anonymous";
        head.appendChild(link);
      }
      // Must be byte-identical to newsListUrl("card") in
      // src/services/newsApiService.ts (the homepage's useAggregatedNews("card")),
      // otherwise the browser downloads the feed twice.
      preload("preload", "/api/news?view=card&limit=100", "fetch");
      // Filled in at build time by the preloadHomeRoute plugin (vite.config.ts).
      var chunks = /*HOME_ROUTE_CHUNKS*/[];
      for (var i = 0; i < chunks.length; i++) preload("modulepreload", chunks[i]);
    })();
  </script>
  <title>thesite.ro | Știri din toate perspectivele</title>
  <meta name="description"
    content="thesite.ro - Agregator de știri din surse multiple. Vezi aceleași evenimente din perspective diferite și înțelege bias-ul mediatic." data-rh="true" />
  <meta name="author" content="thesite.ro" />
  <meta name="keywords" content="știri, news, România, agregator, bias, perspectivă, actualitate, media" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Preload critical custom font (stable path, used in header logo, 9.6 KB).
       IBM Plex Sans / Playfair Display are deliberately NOT preloaded, and
       neither is the hero illustration: measured on a throttled mobile
       profile they competed with the CSS/JS and pushed first paint back by
       ~400-600 ms without improving LCP (they swap in with font-display:swap
       and cause no measurable shift).
       Fraunces / Inter / JetBrains Mono load from pages/IndexEditorial.tsx. -->
  <link rel="preload" href="/fonts/hoolister.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Preconnect for image CDN — no crossorigin (plain img tags don't use CORS) -->
  <link rel="preconnect" href="https://wsrv.nl" />
  <!-- DNS prefetch for image sources and analytics (non-blocking) -->
  <link rel="dns-prefetch" href="https://wsrv.nl" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="dns-prefetch" href="https://media.hotnews.ro" />
  <link rel="dns-prefetch" href="https://static.digi24.ro" />

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#3BD432" />

  <!-- Geo Meta Tags for Romanian News Localization (canonical is set per page via Helmet / api/story-page) -->
  <!-- data-rh="true" lets react-helmet-async replace the defaults below instead of duplicating them. -->
  <link rel="alternate" type="application/rss+xml" title="thesite.ro RSS Feed" href="https://thesite.ro/rss.xml" />
  <meta name="geo.region" content="RO" />
  <meta name="geo.placename" content="Romania" />
  <meta name="geo.position" content="45.9432;24.9668" />
  <meta name="ICBM" content="45.9432, 24.9668" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="thesite.ro | Știri din toate perspectivele" data-rh="true" />
  <meta property="og:description"
    content="Agregator de știri din surse multiple. Vezi aceleași evenimente din perspective diferite." data-rh="true" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://thesite.ro/og-image.png" data-rh="true" />
  <meta property="og:site_name" content="thesite.ro" />
  <meta property="og:locale" content="ro_RO" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@thesitero" />
  <meta name="twitter:title" content="thesite.ro | Știri din toate perspectivele" data-rh="true" />
  <meta name="twitter:description"
    content="Agregator de știri din surse multiple. Vezi aceleași evenimente din perspective diferite." data-rh="true" />
  <!-- Critical CSS - Inline for faster FCP. Values mirror src/index.css
       (:root / .dark) and the real <Header>, so nothing changes colour or
       jumps when the app stylesheet and React take over. -->
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 0 0% 10%;
      --muted-foreground: 0 0% 40%;
    }

    .dark {
      --background: 0 0% 7%;
      --foreground: 42 33% 94%;
      --muted-foreground: 0 0% 60%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: 'IBM Plex Sans Variable', 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: hsl(var(--background));
      background-image: radial-gradient(circle, rgba(0, 0, 0, 0.10) 1px, transparent 1px);
      background-size: 24px 24px;
      color: hsl(var(--foreground));
      min-height: 100vh;
    }

    .dark body {
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    }

    /* Placeholder for the sticky green <Header> (h-14 + nav row on mobile, h-16 from md) */
    .header-skeleton {
      height: 92px;
      background: #3BD432;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    @media (min-width: 768px) {
      .header-skeleton {
        height: 65px;
      }
    }
  </style>

  <!-- Google tag (gtag.js). gtag() and the config command are queued in
       dataLayer right away (so the page_view and any early gtag() calls are
       kept); the ~180 KB library itself loads once the page has finished
       loading, instead of competing with the app's JS and the feed. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-1MYVRJ60EY');

    (function () {
      function load() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-1MYVRJ60EY';
        document.head.appendChild(s);
      }
      function schedule() {
        if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 2000 });
        else setTimeout(load, 0);
      }
      if (document.readyState === 'complete') schedule();
      else window.addEventListener('load', schedule, { once: true });
    })();
  </script>
</head>

<body>
  <!-- Initial loading skeleton (replaced by React) -->
  <div id="root">
    <div class="header-skeleton"></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
